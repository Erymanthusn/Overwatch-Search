<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Barlow+Condensed:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="./app.js" defer></script>
  <title>Overwatch — Hero Database</title>
</head>
<body>

  <div class="linhas"></div>

  <header class="site-header">
    <div class="header-inner">
      <div class="logo-block">
        <div class="ow-logo">
          <img class="ow-logo-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Overwatch_circle_logo.svg/960px-Overwatch_circle_logo.svg.png" alt="">
        </div>
        <div>
          <span class="logo-title">OVERWATCH</span>
          <span class="logo-sub">HERO DATABASE</span>
        </div>
      </div>

      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="heroes">
          <span class="tab-icon">◈</span> HERÓIS
        </button>
        <button class="tab-btn" data-tab="roles">
          <span class="tab-icon">◎</span> FUNÇÕES
        </button>

      </nav>
    </div>
  </header>

  <!-- TAB de Herois-->
  <section id="tab-heroes" class="tab-section active">
    <div class="section-toolbar">
      <div class="search-row">
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="search-heroes" type="text" placeholder="BUSCAR HERÓI..." autocomplete="off">
        </div>
        <div class="filter-chips" id="role-filters">
          <button class="chip active" data-role="">TODOS</button>
          <button class="chip" data-role="tank">TANK</button>
          <button class="chip" data-role="damage">DAMAGE</button>
          <button class="chip" data-role="support">SUPPORT</button>
        </div>
      </div>
    </div>
    <div id="heroes-count" class="result-count"></div>
    <div id="heroes-grid" class="heroes-grid">
      <div class="loader-state">
        <div class="ow-spinner"></div>
        <p>CARREGANDO HERÓIS...</p>
      </div>
    </div>
  </section>

  <!--TAB de Funções-->
  <section id="tab-roles" class="tab-section">
    <div id="roles-grid" class="roles-grid">
      <div class="loader-state">
        <div class="ow-spinner"></div>
        <p>CARREGANDO FUNÇÕES...</p>
      </div>
    </div>
  </section>

  <!--Pop-Up da descrição do heroi-->>
  <div id="hero-modal" class="modal-backdrop" style="display:none">
    <div class="modal-box">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

</body>
</html>
